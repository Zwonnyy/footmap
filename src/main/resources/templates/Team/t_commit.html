<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="shared/_layout">
<head>
    <meta charset="UTF-8">
    <title>팀 등록</title>
</head>
<body>
<div layout:fragment="content">
    <h2>팀 등록</h2>

    <form th:action="@{/Team/create}" method="post" enctype="multipart/form-data">
        <div>
            <label>엠블럼</label>
            <input type="file" name="imageFile" accept="image/*">
        </div>
        <div>
            <label>팀명</label>
            <input type="text" name="t_name" required>
        </div>
        <div>
            <label>주 구장</label>
            <input type="text" name="t_stadium">
        </div>
        <div>
            <label>소개글</label>
            <textarea name="t_intro" rows="5" cols="60"></textarea>
        </div>
        <div>
            <button type="submit">등록하기</button>
            <button type="button" onclick="location.href='/Team/t_search'">취소하기</button>
        </div>
    </form>
</div>
</body>
</html>
