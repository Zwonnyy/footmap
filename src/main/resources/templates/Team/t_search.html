<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="shared/_layout">
<head>
    <meta charset="UTF-8">
    <title>팀 정보 검색</title>
</head>
<body>
<div layout:fragment="content">
    <div class="page-title-row">
        <div>
            <p class="eyebrow">Team</p>
            <h1>팀 정보 검색</h1>
        </div>
        <div class="action-row">
            <a href="/Team/myteam" class="btn btn-outline-primary">내 팀보기</a>
            <a href="/Team/t_commit" class="btn btn-primary">팀 만들기</a>
        </div>
    </div>

    <div class="search-panel">
        <input type="text" id="myInput" placeholder="팀 검색" class="form-control">
        <button type="submit" class="btn btn-primary">검색</button>
    </div>

    <table id="myTable" class="table app-table">
        <thead>
        <tr>
            <th>팀 이름</th>
            <th>홈 구장</th>
            <th>전적</th>
            <th>소개</th>
            <th>가입</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="team : ${team}">
            <td><a th:href="@{/Team/detail(t_code=${team.t_code})}" th:text="${team.t_name}">팀 이름</a></td>
            <td th:text="${team.t_stadium}">홈 구장</td>
            <td th:text="${team.t_vic}+'/'+${team.t_draw}+'/'+${team.t_lose}">전적</td>
            <td th:text="${team.t_intro}">소개</td>
            <td>
                <form action="/Team/join" method="post">
                    <input type="hidden" name="t_code" th:value="${team.t_code}">
                    <button type="submit" class="btn btn-primary">가입하기</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(team)}">
            <td colspan="5">등록된 팀이 없습니다.</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
