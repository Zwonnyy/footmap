<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="shared/_layout">
<head>
    <meta charset="UTF-8">
    <title>팀 상세 정보</title>
</head>
<body>
<div layout:fragment="content">
    <h2>팀 정보</h2>

    <div th:if="${team == null}">
        팀 정보를 찾을 수 없습니다.
    </div>

    <div class="mT" th:if="${team != null}">
        <img width="140" height="140"
             th:src="${team.t_img != null and !team.t_img.isEmpty()} ? @{${team.t_img}} : @{/assets/default-team.svg}"
             alt="팀 엠블럼">
        <div class="box">
            <p th:text="${team.t_name}"></p>
            <p th:text="${team.t_stadium}"></p>
            <p th:text="${team.t_vic} + '승 ' + ${team.t_draw} + '무 ' + ${team.t_lose} + '패'"></p>
        </div>
        <div class="intro" th:text="${team.t_intro}"></div>
        <button type="button" onclick="location.href='/Team/t_search'">목록</button>
    </div>
</div>
</body>
</html>
