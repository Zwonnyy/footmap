<TABLE border="0" class="table table-striped">
<tr>
    <th>사진</th>
    <th>지역</th>
    <th>이 름</th>
    <th>주 소</th>
    <th>규 격</th>
</tr>
<tr th:each="field,index : ${field}" , th:if="${index.index}<10">
    <td>
        <img width="120" height="68"
             th:src="${field.getF_IMG() != null and !field.getF_IMG().isEmpty()} ? ${field.getF_IMG()} : @{/assets/default-field.svg}"
             alt="풋살장 이미지">
    </td>
    <td th:text="${field.getF_AREA()}">지역</td>
    <td th:text="${field.getF_NAME()}">이름</td>
    <td th:text="${field.getF_ADD()}">주소</td>
    <td th:text="${field.getF_SOU()}">규격</td>
</tr>
</TABLE>
