<!DOCTYPE HTML>
<html lang="ko" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="shared/_layout">
<head>
    <title>게시글 작성</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<div layout:fragment="content">
  <div class="page-title-row">
    <div>
      <p class="eyebrow">Community</p>
      <h1>게시글 작성</h1>
    </div>
  </div>
    <div class="card panel-card form-card">
        <form action="/board/write" method="POST" class="card-body form-grid single-column">
            <div class="form-group">
                <label>글제목</label>
                <input type="text" name="b_title" class="form-control"/>
            </div>
            <p class="helper-text">작성자는 로그인한 계정 정보로 자동 등록됩니다.</p>
            <div class="form-group">
                <label>내용</label>
                <textarea rows="10" name="b_contents" placeholder="게시글 입력" class="form-control"></textarea>
            </div>
            <div class="action-row">
                <input type="submit" value="등록" class="btn btn-primary"/>
                <input type="button" value="취소" onclick="location.href='/board/list'" class="btn btn-outline-primary"/>
            </div>
        </form>
    </div>
</div>
</body>
</html>
