<!DOCTYPE HTML>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="shared/_layout">
<head>
  <title>게임 등록</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
</head>
<body>
<div layout:fragment="content">
  <div class="page-title-row">
    <div>
      <p class="eyebrow">Match</p>
      <h1>게임 등록</h1>
    </div>
  </div>

  <div class="card panel-card form-card">
    <form action="/game/register" method="POST" class="card-body form-grid single-column">
      <div class="form-group">
        <label>등록팀</label>
        <select name="g_dung" id="gameTeam" required class="form-select">
          <option value="" disabled selected>팀 선택</option>
          <option th:each="team : ${myTeams}" th:value="${team.t_code}" th:text="${team.t_name}"></option>
        </select>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>일자</label>
          <input type="date" name="g_date" id="gameDate" class="form-control" required>
        </div>
        <div class="form-group">
          <label>시간</label>
          <input type="time" name="g_time" id="gameTime" class="form-control" required>
        </div>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label>인원수</label>
          <select name="g_peo" id="gamePeople" required class="form-select">
            <option value="" disabled selected>인원수</option>
            <option value="3:3">3:3</option>
            <option value="4:4">4:4</option>
            <option value="5:5">5:5</option>
            <option value="6:6">6:6</option>
          </select>
        </div>
        <div class="form-group">
          <label>구장</label>
          <select name="f_code" id="gameField" required class="form-select">
            <option value="" disabled selected>구장 선택</option>
            <option th:each="field : ${fields}" th:value="${field.f_CODE}" th:text="${field.f_NAME}"></option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>추가 내용</label>
        <textarea rows="8" name="g_intro" id="gameIntro" placeholder="경기 소개, 준비물, 희망 매너 등을 입력하세요." class="form-control"></textarea>
      </div>

      <div class="ai-toolbox">
        <button type="button" class="btn btn-outline-primary" id="gameIntroButton">AI로 소개글 작성</button>
        <div class="ai-output" id="gameAiOutput">팀, 일정, 구장을 선택한 뒤 소개글을 만들 수 있습니다.</div>
      </div>

      <div class="action-row">
        <input type="submit" value="등록하기" class="btn btn-primary">
        <input type="button" value="취소하기" class="btn btn-outline-primary" onClick="location.href='/game/search'">
      </div>
    </form>
  </div>
  <script>
    const selectedText = (id) => {
      const select = document.getElementById(id);
      return select.options[select.selectedIndex]?.text || '';
    };
    document.getElementById('gameIntroButton').addEventListener('click', async () => {
      const output = document.getElementById('gameAiOutput');
      output.textContent = 'AI가 경기 소개글을 작성하는 중입니다.';
      const response = await fetch('/ai/game-intro', {
        method: 'POST',
        headers: {'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8'},
        body: new URLSearchParams({
          teamName: selectedText('gameTeam'),
          fieldName: selectedText('gameField'),
          people: document.getElementById('gamePeople').value,
          date: document.getElementById('gameDate').value,
          time: document.getElementById('gameTime').value
        })
      });
      const text = await response.text();
      document.getElementById('gameIntro').value = text;
      output.textContent = text;
    });
  </script>
</div>
</body>
</html>
