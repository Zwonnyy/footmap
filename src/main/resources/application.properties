# database (MySql)
spring.datasource.driver-class-name= com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/db_footmap?serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username = root
spring.datasource.password =


# mybatis
mybatis.config = mybatis/mybatis-config.xml
#mybatis.type-aliases-package = footmap.footmap_spring.dto
mybatis.mapper-locations = mybatis/mapper/*.xml

#spring.thymeleaf.prefix=classpath:/templates/
#spring.thymeleaf.suffix=.html

logging.level.org.springframework=info
logging.level.org.zercok=debug

logging.level.org.springframework.security=trace


spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.sql.init.continue-on-error=true

# AI assistant (uses local fallback text when GEMINI_API_KEY is empty)
gemini.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:}}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.base-url=https://generativelanguage.googleapis.com/v1beta/models
